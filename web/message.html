<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bluebase · Messages</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
:root{
  --blue:#1877f2;
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#050505;
  --sub:#65676b;
  --border:#dddfe2;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}

body{background:var(--bg);}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  height:56px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:1000;
}

.logo{
  font-weight:800;
  font-size:22px;
  color:var(--blue);
  text-decoration:none;
}

/* LAYOUT */
.wrapper{
  margin-top:56px;
  height:calc(100vh - 56px);
  display:grid;
  grid-template-columns:320px 1fr 300px;
}

/* SIDES */
.panel{
  background:white;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

/* LEFT */
.panel h3{
  padding:14px;
  font-size:18px;
  font-weight:800;
}

.search{
  padding:0 14px 10px;
}

.search input{
  width:100%;
  padding:8px 10px;
  border-radius:20px;
  border:1px solid var(--border);
  background:#f0f2f5;
}

.chat-list{
  overflow-y:auto;
}

.chat-item{
  display:flex;
  gap:10px;
  padding:10px 14px;
  cursor:pointer;
}

.chat-item:hover{background:#f2f2f2;}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e4e6eb;
}

.chat-info{
  flex:1;
}

.chat-info h4{
  font-size:14px;
  font-weight:700;
}

.chat-info p{
  font-size:13px;
  color:var(--sub);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* CENTER CHAT */
.chat{
  display:flex;
  flex-direction:column;
}

.chat-header{
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  background:white;
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-header h4{
  font-size:15px;
  font-weight:700;
}

.messages{
  flex:1;
  padding:16px;
  overflow-y:auto;
  background:#f0f2f5;
}

.msg{
  max-width:60%;
  padding:10px 12px;
  margin-bottom:10px;
  border-radius:12px;
  font-size:14px;
}

.me{
  background:var(--blue);
  color:white;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.them{
  background:white;
  border-bottom-left-radius:4px;
}

.input{
  padding:10px;
  background:white;
  border-top:1px solid var(--border);
  display:flex;
  gap:8px;
}

.input input{
  flex:1;
  padding:10px 12px;
  border-radius:20px;
  border:1px solid var(--border);
}

.send{
  background:var(--blue);
  color:white;
  border:none;
  padding:0 16px;
  border-radius:20px;
  font-weight:700;
}

/* RIGHT */
.info{
  background:white;
  border-left:1px solid var(--border);
  padding:14px;
}

.info h4{
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}

.product{
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
}

.thumb{
  width:100%;
  height:140px;
  background:#e4e6eb;
  border-radius:6px;
  margin-bottom:8px;
}

.product strong{
  font-size:14px;
}

.price{
  font-weight:800;
  margin:6px 0;
}

.actions a{
  display:block;
  text-align:center;
  padding:8px;
  border-radius:6px;
  margin-top:6px;
  font-size:13px;
  text-decoration:none;
  font-weight:700;
}

.primary{background:var(--blue);color:white;}
.outline{border:1px solid var(--border);color:#050505;}

/* MOBILE */
@media(max-width:900px){
  .wrapper{grid-template-columns:1fr;}
  .panel,.info{display:none;}
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Bluebase</a>
</header>

<div class="wrapper">

  <!-- LEFT -->
  <aside class="panel">
    <h3>Chats</h3>
    <div class="search">
      <input placeholder="Search messages">
    </div>

    <div class="chat-list">
      <div class="chat-item">
        <div class="avatar"></div>
        <div class="chat-info">
          <h4>Tech Hub AFA</h4>
          <p>Calculator still available?</p>
        </div>
      </div>

      <div class="chat-item">
        <div class="avatar"></div>
        <div class="chat-info">
          <h4>Zainab A.</h4>
          <p>I can meet tomorrow</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- CENTER -->
  <section class="chat">
    <div class="chat-header">
      <div class="avatar"></div>
      <h4>Tech Hub AFA</h4>
    </div>

    <div class="messages">
      <div class="msg them">Yes, calculator is still available.</div>
      <div class="msg me">Price still ₦6k?</div>
      <div class="msg them">Yes, final price.</div>
    </div>

    <div class="input">
      <input placeholder="Type a message…">
      <button class="send">Send</button>
    </div>
  </section>

  <!-- RIGHT -->
  <aside class="info">
    <h4>Item</h4>
    <div class="product">
      <div class="thumb"></div>
      <strong>Scientific Calculator</strong>
      <div class="price">₦6,000</div>
      <div class="actions">
        <a href="product.html" class="primary">View Item</a>
        <a href="cart.html" class="outline">Add to Cart</a>
      </div>
    </div>
  </aside>

</div>

<script>
feather.replace();
</script>

</body>
</html>
