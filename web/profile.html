<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bluebase · Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
:root{
  --blue:#1877f2;
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#050505;
  --sub:#65676b;
  --border:#dddfe2;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  height:56px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:var(--blue);
  text-decoration:none;
}

.header-right a{
  margin-left:18px;
  color:#1c1e21;
}

/* LAYOUT */
.container{
  max-width:1280px;
  margin:72px auto 0;
  padding:0 16px;
  display:grid;
  grid-template-columns:260px 1fr 300px;
  gap:16px;
}

@media(max-width:1100px){
  .rightbar{display:none;}
  .container{grid-template-columns:260px 1fr;}
}
@media(max-width:800px){
  .sidebar{display:none;}
  .container{grid-template-columns:1fr;}
}

/* SIDEBAR */
.sidebar{
  position:sticky;
  top:72px;
}

.side-card{
  background:white;
  border-radius:8px;
  padding:8px;
}

.side-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border-radius:6px;
  font-weight:600;
  font-size:14px;
  color:#050505;
  text-decoration:none;
}

.side-item i{
  width:20px;
  color:var(--blue);
}

.side-item.active,
.side-item:hover{
  background:#f2f2f2;
}

/* MAIN */
.main{
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* PROFILE HEADER */
.profile-header{
  background:white;
  border-radius:8px;
  overflow:hidden;
}

.cover{
  height:200px;
  background:linear-gradient(135deg,#cfd9df,#e2ebf0);
}

.profile-info{
  padding:16px;
  display:flex;
  gap:16px;
  align-items:flex-end;
}

.avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  background:#d8dadf;
  border:4px solid white;
  margin-top:-48px;
}

.profile-meta{
  flex:1;
}

.profile-name{
  font-size:20px;
  font-weight:800;
}

.profile-sub{
  font-size:14px;
  color:var(--sub);
}

.profile-actions a{
  display:inline-block;
  padding:8px 14px;
  border-radius:6px;
  background:#e4e6eb;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  color:#050505;
  margin-left:8px;
}

.profile-actions a.primary{
  background:var(--blue);
  color:white;
}

/* TABS */
.tabs{
  display:flex;
  gap:16px;
  padding:0 16px 12px;
}

.tab{
  font-size:14px;
  font-weight:600;
  color:var(--sub);
  text-decoration:none;
  padding-bottom:8px;
}

.tab.active{
  color:var(--blue);
  border-bottom:2px solid var(--blue);
}

/* CARD */
.card{
  background:white;
  border-radius:8px;
  padding:14px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:16px;
}

.product{
  background:white;
  border-radius:8px;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
}

.product img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.product-body{
  padding:10px;
}

.price{
  font-weight:700;
  color:var(--blue);
}

.title{
  font-size:14px;
  margin-top:4px;
}

/* RIGHT */
.rightbar{
  position:sticky;
  top:72px;
}

.rb-card{
  background:white;
  border-radius:8px;
  padding:12px;
  margin-bottom:12px;
}

.rb-title{
  font-weight:700;
  font-size:14px;
  margin-bottom:10px;
}

.rb-link{
  display:block;
  padding:6px 0;
  font-size:14px;
  text-decoration:none;
  color:#050505;
}

.rb-link:hover{
  color:var(--blue);
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Bluebase</a>
  <div class="header-right">
    <a href="search.html"><i data-feather="search"></i></a>
    <a href="notifications.html"><i data-feather="bell"></i></a>
    <a href="profile.html"><i data-feather="user"></i></a>
  </div>
</header>

<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="side-card">
      <a href="Dashboard.html" class="side-item"><i data-feather="home"></i> Home</a>
      <a href="marketplace.html" class="side-item"><i data-feather="shopping-bag"></i> Marketplace</a>
      <a href="lost-found.html" class="side-item"><i data-feather="alert-circle"></i> Lost & Found</a>
     <a href="cart.html" class="side-item"><i data-feather="shopping-cart"></i> Cart</a>
      <a href="profile.html" class="side-item active"><i data-feather="user"></i> Profile</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- PROFILE HEADER -->
    <div class="profile-header">
      <div class="cover"></div>
      <div class="profile-info">
        <div class="avatar"></div>
        <div class="profile-meta">
          <div class="profile-name">Daz</div>
          <div class="profile-sub">@dazzmond · Student Seller</div>
        </div>
        <div class="profile-actions">
          <a href="edit-profile.html">Edit Profile</a>
          <a href="create-listing.html" class="primary">Sell Item</a>
        </div>
      </div>

      <div class="tabs">
        <a href="profile.html" class="tab active">Listings</a>
        <a href="profile-saved.html" class="tab">Saved</a>
        <a href="profile-about.html" class="tab">About</a>
      </div>
    </div>

    <!-- LISTINGS -->
    <div class="card">
      <div class="grid">

        <a href="product-textbook.html" class="product">
          <img src="https://picsum.photos/400/300?11">
          <div class="product-body">
            <div class="price">₦6,000</div>
            <div class="title">PHY 106 Textbook</div>
          </div>
        </a>

        <a href="product-calculator.html" class="product">
          <img src="https://picsum.photos/400/300?12">
          <div class="product-body">
            <div class="price">₦8,500</div>
            <div class="title">Scientific Calculator</div>
          </div>
        </a>

        <a href="product-headphones.html" class="product">
          <img src="https://picsum.photos/400/300?13">
          <div class="product-body">
            <div class="price">₦15,000</div>
            <div class="title">Wireless Headphones</div>
          </div>
        </a>

      </div>
    </div>

  </main>

  <!-- RIGHT -->
  <aside class="rightbar">
    <div class="rb-card">
      <div class="rb-title">Seller Tools</div>
      <a href="my-listings.html" class="rb-link">My Listings</a>
      <a href="create-listing.html" class="rb-link">Create Listing</a>
      <a href="seller-stats.html" class="rb-link">Seller Stats</a>
    </div>

    <div class="rb-card">
      <div class="rb-title">Account</div>
      <a href="edit-profile.html" class="rb-link">Edit Profile</a>
      <a href="settings.html" class="rb-link">Settings</a>
      <a href="login.html" class="rb-link">Logout</a>
    </div>
  </aside>

</div>

<script>
feather.replace();
</script>

</body>
</html>
