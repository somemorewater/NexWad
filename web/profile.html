<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bluebase – Profile</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- ICONS -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #111;
    }

    /* ================= LAYOUT ================= */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    /* ================= HEADER ================= */
    .profile-header {
      background: linear-gradient(135deg, #1D9BF0, #0c6fdc);
      border-radius: 20px;
      padding: 30px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid #fff;
      object-fit: cover;
    }

    .profile-info h2 {
      font-size: 22px;
      font-weight: 800;
    }

    .profile-info p {
      font-size: 14px;
      opacity: .9;
    }

    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.2);
      font-size: 12px;
      font-weight: 600;
    }

    /* ================= STATS ================= */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .stat {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.05);
    }

    .stat h3 {
      font-size: 18px;
      font-weight: 800;
      color: #1D9BF0;
    }

    .stat span {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
    }

    /* ================= ACTIONS ================= */
    .actions {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .action-card {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.04);
      transition: transform .15s ease;
    }

    .action-card:hover {
      transform: translateY(-2px);
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #eef6ff;
      color: #1D9BF0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .action-text h4 {
      font-size: 14px;
      font-weight: 700;
    }

    .action-text span {
      font-size: 12px;
      color: #6b7280;
    }

    /* ================= LOGOUT ================= */
    .logout {
      margin-top: 30px;
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #dc2626;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }

    /* ================= BOTTOM NAV ================= */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav i {
      font-size: 22px;
      color: #9ca3af;
    }

    .nav i.active {
      color: #1D9BF0;
    }

    @media(max-width: 600px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- PROFILE HEADER -->
  <div class="profile-header">
    <img src="https://i.pravatar.cc/150?img=12" class="avatar">
    <div class="profile-info">
      <h2>Daz</h2>
      <p>ICE · 200L · AFIT</p>
      <span class="badge">Verified Student</span>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <h3>12</h3>
      <span>Orders</span>
    </div>
    <div class="stat">
      <h3>3</h3>
      <span>Lost Items</span>
    </div>
    <div class="stat">
      <h3>9</h3>
      <span>Saved</span>
    </div>
    <div class="stat">
      <h3>4.9</h3>
      <span>Rating</span>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">

    <div class="action-card">
      <div class="icon"><i class='bx bx-package'></i></div>
      <div class="action-text">
        <h4>My Orders</h4>
        <span>Track purchases & history</span>
      </div>
    </div>

    <div class="action-card">
      <div class="icon"><i class='bx bx-search-alt'></i></div>
      <div class="action-text">
        <h4>Post Lost Item</h4>
        <span>Report missing items</span>
      </div>
    </div>

    <div class="action-card">
      <div class="icon"><i class='bx bx-bookmark'></i></div>
      <div class="action-text">
        <h4>Saved</h4>
        <span>Products & posts</span>
      </div>
    </div>

    <div class="action-card">
      <div class="icon"><i class='bx bx-shield'></i></div>
      <div class="action-text">
        <h4>Privacy & Security</h4>
        <span>Control your account</span>
      </div>
    </div>

    <div class="action-card">
      <div class="icon"><i class='bx bx-help-circle'></i></div>
      <div class="action-text">
        <h4>Help & Support</h4>
        <span>Need assistance?</span>
      </div>
    </div>

  </div>

  <!-- LOGOUT -->
  <div class="logout">
    <i class='bx bx-log-out'></i>
    Log out
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <i class='bx bx-home'></i>
  <i class='bx bx-search'></i>
  <i class='bx bx-store'></i>
  <i class='bx bx-user active'></i>
</div>

</body>
</html>
