<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bluebase · Post</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
:root{
  --blue:#1877f2;
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#050505;
  --sub:#65676b;
  --border:#dddfe2;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}

body{background:var(--bg);}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  height:56px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:var(--blue);
  text-decoration:none;
}

/* PAGE */
.page{
  margin-top:72px;
  display:flex;
  justify-content:center;
}

.content{
  width:100%;
  max-width:680px;
}

/* POST */
.post{
  background:white;
  border-radius:8px;
  padding:14px;
  margin-bottom:16px;
}

.post-header{
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e4e6eb;
}

.name{
  font-weight:700;
  font-size:14px;
}

.time{
  font-size:12px;
  color:var(--sub);
}

.post-text{
  margin-top:12px;
  font-size:15px;
  line-height:1.5;
}

.post img{
  width:100%;
  border-radius:8px;
  margin-top:12px;
}

/* META */
.meta{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:var(--sub);
  margin-top:10px;
}

/* REACTIONS */
.reactions{
  display:flex;
  justify-content:space-around;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  margin-top:10px;
}

.react{
  flex:1;
  text-align:center;
  padding:10px 0;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  color:var(--sub);
}

.react:hover{
  background:#f2f2f2;
  color:var(--blue);
}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.actions a{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:6px;
  font-weight:700;
  font-size:14px;
  text-decoration:none;
}

.primary{background:var(--blue);color:white;}
.outline{border:1px solid var(--border);color:#050505;}

/* COMMENTS */
.comments{
  background:white;
  border-radius:8px;
  padding:14px;
}

.comment{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.comment-body{
  background:#f0f2f5;
  border-radius:12px;
  padding:8px 12px;
  font-size:14px;
}

.comment-body strong{
  display:block;
  font-size:13px;
}

.reply{
  font-size:12px;
  color:var(--sub);
  margin-left:50px;
  cursor:pointer;
}

.add-comment{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.add-comment input{
  flex:1;
  padding:10px 12px;
  border-radius:20px;
  border:1px solid var(--border);
}

/* MOBILE */
@media(max-width:600px){
  .content{padding:0 10px;}
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Bluebase</a>
</header>

<div class="page">
  <div class="content">

    <!-- POST -->
    <div class="post">

      <div class="post-header">
        <div class="avatar"></div>
        <div>
          <div class="name">Tech Hub AFA</div>
          <div class="time">5h · Marketplace</div>
        </div>
      </div>

      <div class="post-text">
        Scientific calculator for sale. Very clean, works perfectly.
        Ideal for PHY 106, EEE & engineering courses.
      </div>

      <img src="https://picsum.photos/800/420">

      <div class="meta">
        <div>58 likes</div>
        <div>12 comments</div>
      </div>

      <div class="reactions">
        <div class="react"><i data-feather="thumbs-up"></i> Like</div>
        <div class="react"><i data-feather="message-circle"></i> Comment</div>
        <div class="react"><i data-feather="share-2"></i> Share</div>
      </div>

      <div class="actions">
        <a href="messages.html" class="primary">Message Seller</a>
        <a href="cart.html" class="outline">Add to Cart</a>
      </div>

    </div>

    <!-- COMMENTS -->
    <div class="comments">

      <div class="comment">
        <div class="avatar"></div>
        <div>
          <div class="comment-body">
            <strong>Daz</strong>
            Is the price negotiable?
          </div>
          <div class="reply">Reply</div>
        </div>
      </div>

      <div class="comment">
        <div class="avatar"></div>
        <div>
          <div class="comment-body">
            <strong>Tech Hub AFA</strong>
            Price is final please.
          </div>
          <div class="reply">Reply</div>
        </div>
      </div>

      <div class="add-comment">
        <div class="avatar"></div>
        <input placeholder="Write a comment…">
      </div>

    </div>

  </div>
</div>

<script>
feather.replace();
</script>

</body>
</html>
