<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bluebase – Discover</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- ICONS -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #111;
    }

    /* ================= LAYOUT ================= */
    .app {
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: auto;
    }

    @media (max-width: 1024px) {
      .app {
        grid-template-columns: 1fr;
      }
      .left, .right {
        display: none;
      }
    }

    /* ================= LEFT SIDEBAR ================= */
    .left {
      position: sticky;
      top: 20px;
      height: fit-content;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
    }

    .logo {
      font-weight: 900;
      font-size: 20px;
      color: #1D9BF0;
      margin-bottom: 20px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      color: #111;
      text-decoration: none;
      font-weight: 500;
    }

    .menu a.active,
    .menu a:hover {
      background: #eef6ff;
      color: #1D9BF0;
    }

    /* ================= CENTER ================= */
    .center {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .discover-header {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
    }

    .discover-header h2 {
      font-size: 20px;
      font-weight: 800;
    }

    .discover-header span {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter {
      padding: 8px 14px;
      background: #f1f5f9;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .filter.active {
      background: #1D9BF0;
      color: #fff;
    }

    /* Feed */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-body {
      padding: 14px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .badge.rec {
      background: #e0f2fe;
      color: #0284c7;
    }

    .badge.pop {
      background: #fef3c7;
      color: #92400e;
    }

    .card-title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-weight: 800;
      color: #1D9BF0;
    }

    .actions i {
      font-size: 18px;
      color: #6b7280;
      margin-left: 10px;
      cursor: pointer;
    }

    /* ================= RIGHT ================= */
    .right {
      position: sticky;
      top: 20px;
      height: fit-content;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
    }

    .right h4 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .trend {
      font-size: 13px;
      padding: 8px 0;
      color: #374151;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

<div class="app">

  <!-- LEFT -->
  <aside class="left">
    <div class="logo">Bluebase</div>
    <nav class="menu">
      <a href="#">Home</a>
      <a href="#" class="active">Discover</a>
      <a href="#">Marketplace</a>
      <a href="#">Profile</a>
    </nav>
  </aside>

  <!-- CENTER -->
  <main class="center">

    <div class="discover-header">
      <h2>Discover for You</h2>
      <span id="context"></span>

      <div class="filters">
        <div class="filter active">All</div>
        <div class="filter">Food</div>
        <div class="filter">Gadgets</div>
        <div class="filter">Books</div>
        <div class="filter">Services</div>
        <div class="filter">Lost & Found</div>
      </div>
    </div>

    <div class="feed" id="feed"></div>
  </main>

  <!-- RIGHT -->
  <aside class="right">
    <h4>Trending on Campus</h4>
    <div class="trend">🔥 iPhone 11 for sale</div>
    <div class="trend">📚 PHY 106 Textbook</div>
    <div class="trend">🍔 Midnight Shawarma</div>
    <div class="trend">👜 Lost Black Backpack</div>
  </aside>

</div>

<script>
  /* ================= STUDENT PROFILE ================= */
  const student = {
    department: "ICE",
    level: "200L",
    interests: ["gadgets", "food"]
  };

  document.getElementById("context").innerText =
    `· ${student.department} ${student.level}`;

  /* ================= DATA ================= */
  const posts = [
    {
      title: "iPhone 11 (Clean)",
      desc: "Battery health 89%, very clean",
      price: "₦210,000",
      tag: "gadgets",
      badge: "Recommended",
      img: "https://picsum.photos/600/400?1"
    },
    {
      title: "Hot Shawarma",
      desc: "Near Hostel B – open till midnight",
      price: "₦1,500",
      tag: "food",
      badge: "Popular",
      img: "https://picsum.photos/600/400?2"
    },
    {
      title: "PHY 106 Textbook",
      desc: "No missing pages",
      price: "₦3,500",
      tag: "books",
      badge: "Recommended",
      img: "https://picsum.photos/600/400?3"
    },
    {
      title: "Lost Backpack",
      desc: "Black bag, near LT2",
      price: "—",
      tag: "lost",
      badge: "Urgent",
      img: "https://picsum.photos/600/400?4"
    }
  ];

  const feed = document.getElementById("feed");

  function render() {
    feed.innerHTML = "";
    posts.forEach(p => {
      feed.innerHTML += `
        <div class="card">
          <img src="${p.img}">
          <div class="card-body">
            <span class="badge ${p.badge === "Recommended" ? "rec" : "pop"}">
              ${p.badge}
            </span>
            <div class="card-title">${p.title}</div>
            <div class="card-desc">${p.desc}</div>
            <div class="card-footer">
              <div class="price">${p.price}</div>
              <div class="actions">
                <i class='bx bx-heart'></i>
                <i class='bx bx-bookmark'></i>
                <i class='bx bx-dots-horizontal-rounded'></i>
              </div>
            </div>
          </div>
        </div>
      `;
    });
  }

  render();
</script>

</body>
</html>
