<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexWAD — Offline</title>
    <style>
      body {
        margin: 0;
        font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
        background: #f5f4f0;
        color: #0f172a;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(520px, 92vw);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: #475569; margin: 0 0 16px; line-height: 1.6; }
      .btn {
        display: inline-block;
        padding: 10px 14px;
        border-radius: 10px;
        background: #2563ff;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>NexWAD can’t reach the internet right now. Check your connection and try again.</p>
      <a class="btn" href="/">Go Home</a>
    </div>
  </body>
</html>
