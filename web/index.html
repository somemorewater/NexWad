<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563ff" />
    <meta name="description" content="NexWAD — The community marketplace for AFIT. Buy, sell, find lost items, and connect with campus." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NexWAD" />
    <meta property="og:description" content="Buy, sell, find lost items, and connect with campus." />
    <meta property="og:image" content="/nexwad-social.png" />
    <meta property="og:url" content="https://nexwad.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexWAD" />
    <meta name="twitter:description" content="Buy, sell, find lost items, and connect with campus." />
    <meta name="twitter:image" content="/nexwad-social.png" />
    <title>NexWAD</title>
    <link rel="shortcut icon" href="./src/assets/images/nexwad-logo-preview.png" type="image/x-icon">
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/nexwad-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
    <style>
      #pre-app-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(ellipse at 50% 22%, rgba(37, 99, 255, 0.18), transparent 58%),
          #f5f4f0;
        transition: opacity 220ms ease;
      }

      #pre-app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .pre-app-loader__logo {
        width: 84px;
        height: 84px;
        object-fit: contain;
        animation: prePulse 1.1s ease-in-out infinite;
      }

      .pre-app-loader__ring {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(156, 163, 175, 0.5);
        border-top-color: #2563ff;
        animation: preSpin 0.8s linear infinite;
      }

      @keyframes preSpin { to { transform: rotate(360deg); } }
      @keyframes prePulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="pre-app-loader" role="status" aria-live="polite" aria-label="Loading NexWAD">
      <img src="/nexwad-logo.png" alt="NexWAD" class="pre-app-loader__logo" />
      <div class="pre-app-loader__ring"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
