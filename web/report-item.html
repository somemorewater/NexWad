<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bluebase · Report Item</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
:root{
  --blue:#1877f2;
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#050505;
  --sub:#65676b;
  --border:#dddfe2;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,system-ui,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  height:56px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:var(--blue);
  text-decoration:none;
}

.header-right a{
  margin-left:18px;
  color:#1c1e21;
}

/* LAYOUT */
.container{
  max-width:1100px;
  margin:72px auto 0;
  padding:0 16px;
  display:grid;
  grid-template-columns:260px 1fr;
  gap:16px;
}

@media(max-width:900px){
  .sidebar{display:none;}
  .container{grid-template-columns:1fr;}
}

/* SIDEBAR */
.sidebar{
  position:sticky;
  top:72px;
}

.side-card{
  background:white;
  border-radius:8px;
  padding:8px;
}

.side-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border-radius:6px;
  font-weight:600;
  font-size:14px;
  color:#050505;
  text-decoration:none;
}

.side-item i{width:20px;color:var(--blue);}
.side-item:hover{background:#f2f2f2;}

/* FORM CARD */
.card{
  background:white;
  border-radius:8px;
  padding:20px;
}

.title{
  font-size:20px;
  font-weight:800;
  margin-bottom:6px;
}

.subtitle{
  font-size:14px;
  color:var(--sub);
  margin-bottom:16px;
}

/* FORM */
.form-group{
  margin-bottom:14px;
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin-bottom:6px;
}

input, select, textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:14px;
  outline:none;
}

textarea{
  resize:vertical;
  min-height:120px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--blue);
}

/* RADIO */
.radio-group{
  display:flex;
  gap:16px;
  margin-top:6px;
}

.radio{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:12px;
  margin-top:20px;
}

.btn{
  padding:10px 16px;
  border-radius:6px;
  font-size:14px;
  font-weight:700;
  text-decoration:none;
  text-align:center;
}

.primary{
  background:var(--blue);
  color:white;
}

.outline{
  border:1px solid var(--border);
  color:#050505;
}

/* HELP */
.help{
  margin-top:18px;
  font-size:13px;
  color:var(--sub);
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Bluebase</a>
  <div class="header-right">
    <a href="search.html"><i data-feather="search"></i></a>
    <a href="notifications.html"><i data-feather="bell"></i></a>
    <a href="profile.html"><i data-feather="user"></i></a>
  </div>
</header>

<div class="container">

  <!-- SIDEBAR -->
   <aside class="sidebar">
    <div class="side-card">
      <a href="index.html" class="side-item"><i data-feather="home"></i> Home</a>
      <a href="marketplace.html" class="side-item"><i data-feather="shopping-bag"></i> Marketplace</a>
      <a href="lost-found.html" class="side-item"><i data-feather="alert-circle"></i> Lost & Found</a>
     <a href="cart.html" class="side-item"><i data-feather="shopping-cart"></i> Cart</a>
      <a href="profile.html" class="side-item active"><i data-feather="user"></i> Profile</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <div class="card">

      <div class="title">Report Lost or Found Item</div>
      <div class="subtitle">Help students recover missing items faster</div>

      <form action="submit-report.html" method="post">

        <!-- TYPE -->
        <div class="form-group">
          <label>Item Status</label>
          <div class="radio-group">
            <label class="radio">
              <input type="radio" name="status" checked> Lost
            </label>
            <label class="radio">
              <input type="radio" name="status"> Found
            </label>
          </div>
        </div>

        <!-- TITLE -->
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" placeholder="e.g. HP Laptop Charger" required>
        </div>

        <!-- CATEGORY -->
        <div class="form-group">
          <label>Category</label>
          <select>
            <option>Electronics</option>
            <option>Books</option>
            <option>ID Cards</option>
            <option>Clothing</option>
            <option>Other</option>
          </select>
        </div>

        <!-- LOCATION -->
        <div class="form-group">
          <label>Last Seen / Found Location</label>
          <input type="text" placeholder="e.g. Hostel B, Common Room">
        </div>

        <!-- DESCRIPTION -->
        <div class="form-group">
          <label>Description</label>
          <textarea placeholder="Add identifying details to help verification"></textarea>
        </div>

        <!-- IMAGE -->
        <div class="form-group">
          <label>Upload Image (optional)</label>
          <input type="file">
        </div>

        <!-- ACTIONS -->
        <div class="actions">
          <button class="btn primary" type="submit">Submit Report</button>
          <a href="lost-found.html" class="btn outline">Cancel</a>
        </div>

      </form>

      <div class="help">
        Tip: Avoid sharing sensitive personal details publicly.
      </div>

    </div>
  </main>

</div>

<script>
feather.replace();
</script>

</body>
</html>
