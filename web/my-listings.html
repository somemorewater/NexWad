<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bluebase · Marketplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
:root{
  --blue:#1877f2;
  --bg:#f0f2f5;
  --card:#ffffff;
  --text:#050505;
  --sub:#65676b;
  --border:#dddfe2;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}

body{background:var(--bg);}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  height:56px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:var(--blue);
  text-decoration:none;
}

.new-btn{
  background:var(--blue);
  color:white;
  padding:8px 14px;
  border-radius:6px;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
}

/* PAGE */
.page{
  margin-top:72px;
  padding:0 16px;
  max-width:1280px;
  margin-left:auto;
  margin-right:auto;
}

/* FILTERS */
.filters{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.filters select{
  padding:8px 10px;
  border-radius:6px;
  border:1px solid var(--border);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.card{
  background:white;
  border-radius:8px;
  overflow:hidden;
  cursor:pointer;
  text-decoration:none;
  color:inherit;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.card-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:4px;
}

.card-price{
  color:var(--blue);
  font-weight:800;
}

.card-meta{
  font-size:12px;
  color:var(--sub);
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Bluebase</a>
  <a href="create-listing.html" class="new-btn">+ New Listing</a>
</header>

<div class="page">

  <div class="filters">
    <select><option>All Categories</option></select>
    <select><option>Price: Low to High</option></select>
    <select><option>Location</option></select>
  </div>

  <div class="grid">

    <a href="post.html" class="card">
      <img src="https://picsum.photos/400/300">
      <div class="card-body">
        <div class="card-title">Scientific Calculator</div>
        <div class="card-price">₦6,000</div>
        <div class="card-meta">Tech Hub AFA</div>
      </div>
    </a>

    <a href="post.html" class="card">
      <img src="https://picsum.photos/401/300">
      <div class="card-body">
        <div class="card-title">PHY 106 Textbook</div>
        <div class="card-price">₦4,500</div>
        <div class="card-meta">Daz</div>
      </div>
    </a>

    <a href="post.html" class="card">
      <img src="https://picsum.photos/402/300">
      <div class="card-body">
        <div class="card-title">Bluetooth Headset</div>
        <div class="card-price">₦9,000</div>
        <div class="card-meta">Campus Store</div>
      </div>
    </a>

  </div>

</div>

<script>
feather.replace();
</script>

</body>
</html>
